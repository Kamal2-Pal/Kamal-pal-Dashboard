<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinculum Order Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 24px; color: var(--accent); }
    .source-info { font-size: 13px; color: var(--text-muted); }
    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    input, select, button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    button { cursor: pointer; background: var(--accent); color: #000; font-weight: bold; }
    button:hover { opacity: 0.9; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 8px;
    }
    .kpi-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
    .kpi-value { font-size: 24px; font-weight: bold; margin-top: 5px; color: var(--accent); }
    .coverage-banner {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .tab-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-bottom: 2px solid transparent;
      border-radius: 0;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Vinculum Order Dashboard</h1>
      <div id="sourceText" class="source-info">Loading report status...</div>
    </div>
  </div>

  <div id="orderCoverage" class="coverage-banner">
    Order data coverage: Calculating...
  </div>

  <div class="controls">
    <input type="text" id="searchOrder" placeholder="Search Order No..." />
    <select id="monthFilter">
      <option value="ALL">All Months</option>
    </select>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title">Unique Orders</div>
      <div id="uniqueOrders" class="kpi-value">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Total Qty</div>
      <div id="totalOrderQty" class="kpi-value">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Picked Qty</div>
      <div id="pickedQty" class="kpi-value">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Shipped Qty</div>
      <div id="shippedQty" class="kpi-value">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Open Qty</div>
      <div id="openQty" class="kpi-value">0</div>
    </div>
  </div>

  <div id="yesterdaySummary" class="summary-card">
    Calculating Yesterday Summary...
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="allOrdersBtn">Overview</button>
    <button class="tab-btn" id="slaTabBtn">SLA Analytics</button>
  </div>

  <div id="slaContainer"></div>

<script>
let raw = [];
const $ = id => document.getElementById(id);

// 1. SAFE DATE PARSER (Fixes NaN -> NaN Issue)
function safeParseDate(val) {
  if (!val) return null;
  if (val instanceof Date) return isNaN(val.getTime()) ? null : val;

  // Excel Serial Numbers (e.g. 45534.5)
  if (typeof val === 'number') {
    const parsed = new Date((val - (25567 + 2)) * 86400 * 1000);
    return isNaN(parsed.getTime()) ? null : parsed;
  }

  // String formats (DD/MM/YYYY, DD-MM-YYYY HH:MM:SS, YYYY-MM-DD)
  if (typeof val === 'string') {
    const cleanStr = val.trim();
    const parts = cleanStr.split(/[\/\-\s:]+/);
    if (parts.length >= 3) {
      let day, month, year;
      if (parts[0].length === 4) { // YYYY-MM-DD
        year = parseInt(parts[0], 10);
        month = parseInt(parts[1], 10) - 1;
        day = parseInt(parts[2], 10);
      } else { // DD/MM/YYYY or DD-MM-YYYY
        day = parseInt(parts[0], 10);
        month = parseInt(parts[1], 10) - 1;
        year = parseInt(parts[2], 10);
      }
      
      const hours = parts[3] ? parseInt(parts[3], 10) : 0;
      const minutes = parts[4] ? parseInt(parts[4], 10) : 0;
      const seconds = parts[5] ? parseInt(parts[5], 10) : 0;

      const d = new Date(year, month, day, hours, minutes, seconds);
      if (!isNaN(d.getTime())) return d;
    }
  }

  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}

function get(row, keys) {
  if (!row) return null;
  for (let k of keys) {
    if (row[k] !== undefined && row[k] !== null) return row[k];
  }
  return null;
}

function orderLevel(data) {
  const map = new Map();
  data.forEach(r => {
    const orderNo = get(r, ["Order No", "OrderNo", "Order_No", "Order Number"]);
    if (orderNo && !map.has(orderNo)) {
      map.set(orderNo, r);
    }
  });
  return Array.from(map.values());
}

// CENTRAL EXCEL LOADER
async function loadCentralExcel(){
  try {
    const r = await fetch("data.xlsx?ts=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw Error("data.xlsx not found");

    const arrayBuffer = await r.arrayBuffer();
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
    const firstSheetName = workbook.SheetNames[0];
    raw = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);

    if (!raw.length) throw Error("No order data found");

    const lm = r.headers.get("Last-Modified");
    const displayTime = lm ? new Date(lm).toLocaleString() : new Date().toLocaleString();

    populateFilters();
    renderOrders();
    initSlaFilters();

    if ($("sourceText")) {
      $("sourceText").textContent = `LIVE Vinculum Order report • ${raw.length.toLocaleString()} report rows • data.xlsx • Last Updated: ${displayTime}`;
    }
  } catch(e) {
    if ($("sourceText")) {
      $("sourceText").textContent = "LIVE Order report unavailable — Please upload data.xlsx";
    }
    raw = [];
    populateFilters();
    renderOrders();
  }
}

// FILTER POPULATION
function populateFilters() {
  const monthSelect = $("monthFilter");
  if (!monthSelect) return;
  
  monthSelect.innerHTML = '<option value="ALL">All Months</option>';
  const months = new Set();
  
  raw.forEach(r => {
    const d = safeParseDate(get(r, ["Order create date", "Order Create Date", "OrderDate", "Order_Date", "Date"]));
    if (d) {
      const monthYear = d.toLocaleString('default', { month: 'short', year: 'numeric' });
      months.add(monthYear);
    }
  });

  months.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m;
    monthSelect.appendChild(opt);
  });
}

function getFilteredData() {
  let filtered = [...raw];
  const searchVal = $("searchOrder") ? $("searchOrder").value.trim().toLowerCase() : "";
  const monthVal = $("monthFilter") ? $("monthFilter").value : "ALL";

  if (searchVal) {
    filtered = filtered.filter(r => {
      const orderNo = String(get(r, ["Order No", "OrderNo", "Order_No", "Order Number"]) || "").toLowerCase();
      return orderNo.includes(searchVal);
    });
  }

  if (monthVal !== "ALL") {
    filtered = filtered.filter(r => {
      const d = safeParseDate(get(r, ["Order create date", "Order Create Date", "OrderDate", "Order_Date", "Date"]));
      if (!d) return false;
      const monthYear = d.toLocaleString('default', { month: 'short', year: 'numeric' });
      return monthYear === monthVal;
    });
  }

  return filtered;
}

// MAIN RENDER FUNCTION
function renderOrders() {
  const current = getFilteredData();
  const uniqueRows = orderLevel(current);
  const totalUnique = uniqueRows.length;

  // Safe parse all dates for Coverage calculation
  const validDates = current
    .map(r => safeParseDate(get(r, ["Order create date", "Order Create Date", "OrderDate", "Order_Date", "Date"])))
    .filter(d => d !== null);

  // Render Order Data Coverage Line (Fixes NaN issue)
  if ($("orderCoverage")) {
    if (validDates.length > 0) {
      const minTimestamp = Math.min(...validDates.map(d => d.getTime()));
      const maxTimestamp = Math.max(...validDates.map(d => d.getTime()));
      
      const minD = new Date(minTimestamp).toLocaleDateString('en-IN');
      const maxD = new Date(maxTimestamp).toLocaleDateString('en-IN');
      
      $("orderCoverage").textContent = `Order data coverage: ${minD} → ${maxD} • ${totalUnique.toLocaleString()} unique orders`;
    } else {
      $("orderCoverage").textContent = `Order data coverage: N/A • ${totalUnique.toLocaleString()} unique orders`;
    }
  }

  // Calculate Aggregates
  let totalQty = 0;
  let pickedQty = 0;
  let shippedQty = 0;
  let openQty = 0;

  current.forEach(r => {
    const qty = Number(get(r, ["Order Qty", "OrderQty", "Qty", "Quantity"]) || 0);
    const status = String(get(r, ["Status", "Order Status", "OrderStatus"]) || "").toLowerCase();

    totalQty += qty;
    if (status.includes("pick") || status.includes("allocated")) pickedQty += qty;
    if (status.includes("ship") || status.includes("dispatch") || status.includes("delivered")) shippedQty += qty;
    if (status.includes("open") || status.includes("pending") || status.includes("created")) openQty += qty;
  });

  // KPI UI Updates
  if ($("uniqueOrders")) $("uniqueOrders").textContent = totalUnique.toLocaleString();
  if ($("totalOrderQty")) $("totalOrderQty").textContent = totalQty.toLocaleString();
  if ($("pickedQty")) $("pickedQty").textContent = pickedQty.toLocaleString();
  if ($("shippedQty")) $("shippedQty").textContent = shippedQty.toLocaleString();
  if ($("openQty")) $("openQty").textContent = openQty.toLocaleString();

  renderYesterdaySummary(current);
}

// YESTERDAY SUMMARY COMPUTATION
function renderYesterdaySummary(data) {
  if (!$("yesterdaySummary")) return;

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const targetDateStr = yesterday.toLocaleDateString('en-IN');

  const yesterdayRows = data.filter(r => {
    const d = safeParseDate(get(r, ["Order create date", "Order Create Date", "OrderDate", "Order_Date", "Date"]));
    return d && d.toLocaleDateString('en-IN') === targetDateStr;
  });

  const yUnique = orderLevel(yesterdayRows).length;
  let yQty = 0;
  yesterdayRows.forEach(r => {
    yQty += Number(get(r, ["Order Qty", "OrderQty", "Qty", "Quantity"]) || 0);
  });

  $("yesterdaySummary").innerHTML = `
    <div style="font-weight: bold; margin-bottom: 5px;">Yesterday Summary (${targetDateStr})</div>
    <div>Unique Orders: <strong>${yUnique.toLocaleString()}</strong> | Total Qty: <strong>${yQty.toLocaleString()}</strong></div>
  `;
}

function initSlaFilters() {
  const btn = $("slaTabBtn");
  if (btn) {
    btn.onclick = () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    };
  }
  const allBtn = $("allOrdersBtn");
  if (allBtn) {
    allBtn.onclick = () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      allBtn.classList.add("active");
    };
  }
}

// LISTENERS & INITIALIZATION
window.addEventListener("DOMContentLoaded", () => {
  if ($("searchOrder")) $("searchOrder").addEventListener("input", renderOrders);
  if ($("monthFilter")) $("monthFilter").addEventListener("change", renderOrders);
  
  loadCentralExcel();
});
</script>
</body>
</html>
