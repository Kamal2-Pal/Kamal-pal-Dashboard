<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PW - Order Dashboard V2</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .logo-title { display: flex; align-items: center; gap: 12px; }
        .logo { background: #f97316; color: white; font-weight: bold; padding: 8px 14px; border-radius: 8px; font-size: 20px; }
        .title-area h1 { font-size: 20px; color: #ffffff; }
        
        .status-bar { display: flex; gap: 15px; font-size: 12px; margin-top: 6px; flex-wrap: wrap; }
        .status-badge { background: #334155; padding: 5px 12px; border-radius: 6px; color: #94a3b8; }
        .status-badge b { color: #38bdf8; }

        .actions { display: flex; gap: 10px; align-items: center; }
        .btn-refresh { background: #475569; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-refresh:hover { background: #334155; }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; }
        .card-title { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: bold; margin-bottom: 8px; }
        .card-value { font-size: 24px; font-weight: bold; color: #f8fafc; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-title">
            <div class="logo">V</div>
            <div class="title-area">
                <h1>PW - Order Dashboard V2</h1>
                <div class="status-bar">
                    <div class="status-badge">📥 Report Generated: <b id="lbl-report-time">Loading...</b></div>
                    <div class="status-badge">🚀 Last GitHub Sync: <b id="lbl-sync-time">Loading...</b></div>
                    <div class="status-badge">📊 Total Rows: <b id="lbl-rows">0</b></div>
                </div>
            </div>
        </div>
        <div class="actions">
            <button class="btn-refresh" onclick="loadDashboardData()">🔄 Refresh</button>
        </div>
    </div>

    <!-- Summary Cards -->
    <div class="cards-grid">
        <div class="card">
            <div class="card-title">Unique Orders</div>
            <div class="card-value" id="val-unique-orders">0</div>
        </div>
        <div class="card">
            <div class="card-title">Total Order Qty</div>
            <div class="card-value" id="val-total-qty">0</div>
        </div>
        <div class="card">
            <div class="card-title">Picked Qty</div>
            <div class="card-value" id="val-picked-qty">0</div>
        </div>
        <div class="card">
            <div class="card-title">Shipped Qty</div>
            <div class="card-value" id="val-shipped-qty">0</div>
        </div>
        <div class="card">
            <div class="card-title">Open Qty</div>
            <div class="card-value" id="val-open-qty">0</div>
        </div>
        <div class="card">
            <div class="card-title">Cancelled Orders</div>
            <div class="card-value" id="val-cancelled">0</div>
        </div>
    </div>

    <script>
        async function loadSyncInfo() {
            try {
                const res = await fetch('sync_info.json?t=' + new Date().getTime());
                if(res.ok) {
                    const data = await res.json();
                    document.getElementById('lbl-report-time').innerText = data.report_generated_at || 'N/A';
                    document.getElementById('lbl-sync-time').innerText = data.last_sync_at || 'N/A';
                    document.getElementById('lbl-rows').innerText = (data.total_rows || 0).toLocaleString();
                } else {
                    document.getElementById('lbl-sync-time').innerText = 'Manual Upload';
                }
            } catch (e) {
                document.getElementById('lbl-sync-time').innerText = 'Local Data';
            }
        }

        async function loadDashboardData() {
            loadSyncInfo();
            try {
                const response = await fetch('data.xlsx?t=' + new Date().getTime());
                const arrayBuffer = await response.arrayBuffer();
                const data = new Uint8Array(arrayBuffer);
                const workbook = XLSX.read(data, { type: 'array' });
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const json = XLSX.utils.sheet_to_json(worksheet);

                processData(json);
            } catch (err) {
                console.error("Error loading Excel file:", err);
            }
        }

        function processData(rows) {
            let uniqueOrders = new Set();
            let totalQty = 0, pickedQty = 0, shippedQty = 0, openQty = 0, cancelledOrders = 0;

            rows.forEach(r => {
                const orderNo = r['Order No'] || r['OrderNo'] || r['ORDER_NO'];
                if(orderNo) uniqueOrders.add(orderNo);

                const qty = Number(r['Qty'] || r['Quantity'] || 1);
                totalQty += qty;

                const status = String(r['Status'] || r['Order Status'] || '').toLowerCase();
                if(status.includes('pick')) pickedQty += qty;
                else if(status.includes('ship')) shippedQty += qty;
                else if(status.includes('open') || status.includes('pending')) openQty += qty;
                else if(status.includes('cancel')) cancelledOrders += 1;
            });

            document.getElementById('val-unique-orders').innerText = uniqueOrders.size.toLocaleString();
            document.getElementById('val-total-qty').innerText = totalQty.toLocaleString();
            document.getElementById('val-picked-qty').innerText = pickedQty.toLocaleString();
            document.getElementById('val-shipped-qty').innerText = shippedQty.toLocaleString();
            document.getElementById('val-open-qty').innerText = openQty.toLocaleString();
            document.getElementById('val-cancelled').innerText = cancelledOrders.toLocaleString();
        }

        window.onload = loadDashboardData;
    </script>
</body>
</html>
