<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Master Dashboard - PW</title>
<style>
  html,body{ margin:0; padding:0; background:#0a0f18; }
  #vc-root{
    --bg:#0d1420; --card:#131b2b; --card2:#111827; --border:#232d40;
    --text:#e7ebf3; --muted:#8b96ab; --orange:#f97316; --green:#22c55e;
    --red:#ef4444; --blue:#3b82f6; --purple:#a855f7; --yellow:#eab308;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text); background: var(--bg);
    max-width: 1200px; margin: 0 auto;
    padding: 24px 20px 60px; box-sizing: border-box; min-height:100vh;
  }
  #vc-root *{ box-sizing: border-box; }
  .vc-header{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
  .vc-title{ font-size:22px; font-weight:700; margin:0;}
  .vc-sub{ font-size:13px; color:var(--muted); margin:4px 0 0;}
  .vc-btn{ background:var(--orange); color:#1a1005; border:none; padding:9px 14px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; }
  .vc-btn:hover{ filter:brightness(1.08); }
  .vc-btn.secondary{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .vc-card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .vc-source{ margin-bottom:14px; }
  .vc-source label{ font-size:11px; letter-spacing:.05em; color:var(--muted); text-transform:uppercase; }
  .vc-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px; }
  .vc-input{ flex:1; min-width:220px; background:var(--card2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:8px; font-size:13px; }
  .vc-status{ font-size:12px; color:var(--green); margin-top:8px; min-height:16px; }
  .vc-status.err{ color:var(--red); }
  .vc-filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .vc-filter{ display:flex; flex-direction:column; gap:5px; min-width:150px; }
  .vc-filter label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .vc-select, .vc-date{ background:var(--card2); border:1px solid var(--border); color:var(--text); padding:8px 9px; border-radius:8px; font-size:13px; }
  .vc-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
  .vc-stat{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .vc-stat .n{ font-size:24px; font-weight:700; }
  .vc-stat .l{ font-size:12px; color:var(--muted); margin-top:2px; }
  .vc-grid{ display:grid; grid-template-columns:1.1fr 1fr 1.3fr; gap:14px; }
  @media (max-width:900px){ .vc-grid{ grid-template-columns:1fr; } }
  .vc-card h3{ font-size:14px; margin:0 0 12px; }
  .vc-list{ display:flex; flex-direction:column; gap:9px; max-height:280px; overflow-y:auto; }
  .vc-list-row{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .vc-list-name{ flex:1; color:#c7cfdd; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vc-list-val{ background:var(--card2); border-radius:6px; padding:2px 8px; font-weight:600; font-size:12.5px; min-width:44px; text-align:right; }
  .vc-donut-wrap{ display:flex; flex-direction:column; align-items:center; gap:12px; }
  .vc-legend{ width:100%; display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .vc-legend-row{ display:flex; align-items:center; gap:8px; }
  .vc-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .vc-empty{ color:var(--muted); font-size:13px; text-align:center; padding:30px 10px; }
</style>
</head>
<body>
<div id="vc-mount"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo, useRef} = React;

const COLORS = {
  Open:"#ef4444", Allocated:"#3b82f6", Picked:"#eab308", Packed:"#a855f7",
  Shipped:"#22c55e", Delivered:"#10b981", Cancelled:"#6b7280", Closed:"#22c55e",
  "On Hold":"#f97316", Unknown:"#8b96ab", "Pick complete":"#22c55e",
  "Part Allocated":"#eab308"
};
const PALETTE = ["#f97316","#3b82f6","#22c55e","#a855f7","#eab308","#ef4444","#10b981","#ec4899"];
const colorFor = (key, idx) => COLORS[key] || PALETTE[idx % PALETTE.length];

function parseDate(v){
  if(!v) return null;
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
function dkey(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dlabel(d){
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
}

function Donut({data}){
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type:"doughnut",
      data:{
        labels:data.map(d=>d.label),
        datasets:[{data:data.map(d=>d.value), backgroundColor:data.map(d=>d.color), borderColor:"#131b2b", borderWidth:2}]
      },
      options:{ cutout:"68%", plugins:{legend:{display:false}}, animation:{duration:400} }
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[data]);
  const total = data.reduce((s,d)=>s+d.value,0);
  return (
    <div className="vc-donut-wrap">
      <div style={{position:"relative", width:170, height:170}}>
        <canvas ref={ref} width={170} height={170}></canvas>
        <div style={{position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, fontWeight:700}}>
          {total.toLocaleString()}
        </div>
      </div>
      <div className="vc-legend">
        {data.map(d=>(
          <div className="vc-legend-row" key={d.label}>
            <span className="vc-dot" style={{background:d.color}}></span>
            <span style={{flex:1, color:"#c7cfdd"}}>{d.label}</span>
            <span style={{fontWeight:600}}>{d.value.toLocaleString()}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function DayBar({data}){
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type:"bar",
      data:{ labels:data.map(d=>d.label), datasets:[{label:"Orders", data:data.map(d=>d.value), backgroundColor:"#f97316", borderRadius:4, maxBarThickness:22}] },
      options:{
        plugins:{legend:{display:false}},
        scales:{
          x:{ grid:{display:false}, ticks:{color:"#8b96ab", font:{size:10}} },
          y:{ grid:{color:"#232d40"}, ticks:{color:"#8b96ab", font:{size:10}}, beginAtZero:true }
        },
        animation:{duration:400}
      }
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[data]);
  return <canvas ref={ref} height={200}></canvas>;
}

function App(){
  const [csvUrl, setCsvUrl] = useState("");
  const [rows, setRows] = useState([]);
  const [status, setStatus] = useState({msg:"", err:false});
  const [lastUpdated, setLastUpdated] = useState(null);
  const [loading, setLoading] = useState(false);

  const [fWarehouse, setFWarehouse] = useState("All");
  const [fChannel, setFChannel] = useState("All");
  const [fOrderType, setFOrderType] = useState("All");
  const [fStatus, setFStatus] = useState("All");
  const [fFrom, setFFrom] = useState("");
  const [fTo, setFTo] = useState("");

  useEffect(()=>{
    try{
      const savedUrl = localStorage.getItem("vinculum-orders:csv-url");
      if(savedUrl) setCsvUrl(savedUrl);
      const cached = localStorage.getItem("vinculum-orders:cache");
      if(cached){
        const parsed = JSON.parse(cached);
        setRows(parsed.rows || []);
        setLastUpdated(parsed.updatedAt || null);
      }
      if(savedUrl) fetchData(savedUrl);
    }catch(e){}
  },[]);

  const fetchData = async (urlOverride) => {
    const url = (urlOverride ?? csvUrl).trim();
    if(!url){ setStatus({msg:"Paste a published Google Sheet CSV link first.", err:true}); return; }
    setLoading(true);
    setStatus({msg:"Fetching...", err:false});
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error("HTTP "+res.status);
      const text = await res.text();
      const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
      const clean = parsed.data.filter(r => r["Order No"] && String(r["Order No"]).trim() !== "");
      setRows(clean);
      const now = new Date().toLocaleString();
      setLastUpdated(now);
      setStatus({msg:`Loaded ${clean.length} order lines.`, err:false});
      try{
        localStorage.setItem("vinculum-orders:csv-url", url);
        localStorage.setItem("vinculum-orders:cache", JSON.stringify({rows:clean, updatedAt:now}));
      }catch(e){}
    }catch(e){
      setStatus({msg:"Could not fetch that link. Make sure the sheet is published to the web as CSV.", err:true});
    }
    setLoading(false);
  };

  const options = useMemo(()=>{
    const wh = new Set(), ch = new Set(), ot = new Set(), st = new Set();
    rows.forEach(r=>{
      if(r["FulfillmentLocationName"]) wh.add(r["FulfillmentLocationName"]);
      if(r["Sales Channel"]) ch.add(r["Sales Channel"]);
      if(r["Order Type"]) ot.add(r["Order Type"]);
      if(r["Status"]) st.add(r["Status"]);
    });
    return {
      warehouses:["All", ...Array.from(wh).sort()],
      channels:["All", ...Array.from(ch).sort()],
      orderTypes:["All", ...Array.from(ot).sort()],
      statuses:["All", ...Array.from(st).sort()],
    };
  },[rows]);

  const filtered = useMemo(()=>{
    return rows.filter(r=>{
      if(fWarehouse!=="All" && r["FulfillmentLocationName"]!==fWarehouse) return false;
      if(fChannel!=="All" && r["Sales Channel"]!==fChannel) return false;
      if(fOrderType!=="All" && r["Order Type"]!==fOrderType) return false;
      if(fStatus!=="All" && r["Status"]!==fStatus) return false;
      if(fFrom || fTo){
        const d = parseDate(r["OrderDate"]);
        if(!d) return false;
        if(fFrom && d < new Date(fFrom)) return false;
        if(fTo && d > new Date(fTo+"T23:59:59")) return false;
      }
      return true;
    });
  },[rows, fWarehouse, fChannel, fOrderType, fStatus, fFrom, fTo]);

  const metrics = useMemo(()=>{
    const orderMap = new Map();
    let openQty=0, shippedQty=0, orderQty=0;
    filtered.forEach(r=>{
      const id = r["Order No"];
      if(!orderMap.has(id)) orderMap.set(id, r["Status"] || "Unknown");
      openQty += Number(r["Open Qty"])||0;
      shippedQty += Number(r["Shipped Qty"])||0;
      orderQty += Number(r["Order Qty"])||0;
    });
    const statusCounts = {};
    orderMap.forEach(s=>{ statusCounts[s] = (statusCounts[s]||0)+1; });
    const statusData = Object.entries(statusCounts)
      .sort((a,b)=>b[1]-a[1])
      .map(([label,value],i)=>({label, value, color:colorFor(label,i)}));

    const whCounts = {};
    filtered.forEach(r=>{
      const wh = r["FulfillmentLocationName"] || "Unknown";
      const id = r["Order No"];
      whCounts[wh] = whCounts[wh] || new Set();
      whCounts[wh].add(id);
    });
    const whData = Object.entries(whCounts)
      .map(([label,set])=>({label, value:set.size}))
      .sort((a,b)=>b.value-a.value)
      .slice(0,10);

    const dayCounts = {};
    filtered.forEach(r=>{
      const d = parseDate(r["OrderDate"]);
      if(!d) return;
      const k = dkey(d);
      dayCounts[k] = dayCounts[k] || {label:dlabel(d), set:new Set(), sortKey:d};
      dayCounts[k].set.add(r["Order No"]);
    });
    const dayData = Object.values(dayCounts)
      .sort((a,b)=>a.sortKey-b.sortKey)
      .slice(-20)
      .map(d=>({label:d.label, value:d.set.size}));

    return {
      totalOrders: orderMap.size,
      totalLines: filtered.length,
      orderQty, openQty, shippedQty,
      statusData, whData, dayData
    };
  },[filtered]);

  const exportCsv = () => {
    if(!filtered.length) return;
    const csv = Papa.unparse(filtered);
    const blob = new Blob([csv], {type:"text/csv"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "master-dashboard-pw-orders.csv";
    a.click();
  };

  return (
    <div id="vc-root">
      <div className="vc-header">
        <div>
          <p className="vc-title">Master Dashboard - PW</p>
          <p className="vc-sub">Vinculum WMS Orders — pasted into Google Sheets, auto-fetched here</p>
        </div>
        <div style={{display:"flex", gap:8}}>
          <button className="vc-btn secondary" onClick={()=>fetchData()} disabled={loading}>{loading ? "Refreshing..." : "Refresh Now"}</button>
        </div>
      </div>

      <div className="vc-card vc-source">
        <label>Data source — Google Sheet published as CSV</label>
        <div className="vc-row">
          <input className="vc-input" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"
                 value={csvUrl} onChange={e=>setCsvUrl(e.target.value)} />
          <button className="vc-btn" onClick={()=>fetchData()} disabled={loading}>Save & Fetch</button>
          {filtered.length>0 && <button className="vc-btn secondary" onClick={exportCsv}>Export CSV</button>}
        </div>
        <div className={"vc-status" + (status.err?" err":"")}>
          {status.msg}{lastUpdated ? `  ·  Last updated: ${lastUpdated}` : ""}
        </div>
      </div>

      {rows.length === 0 ? (
        <div className="vc-card"><div className="vc-empty">No data loaded yet. Paste your Google Sheet's published CSV link above and click "Save & Fetch".<br/><br/>In Sheets: File → Share → Publish to web → choose the sheet → CSV → Publish, then paste that link here.</div></div>
      ) : (
        <>
          <div className="vc-filters">
            <div className="vc-filter">
              <label>Warehouse</label>
              <select className="vc-select" value={fWarehouse} onChange={e=>setFWarehouse(e.target.value)}>
                {options.warehouses.map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div className="vc-filter">
              <label>Channel</label>
              <select className="vc-select" value={fChannel} onChange={e=>setFChannel(e.target.value)}>
                {options.channels.map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div className="vc-filter">
              <label>Order Type</label>
              <select className="vc-select" value={fOrderType} onChange={e=>setFOrderType(e.target.value)}>
                {options.orderTypes.map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div className="vc-filter">
              <label>Status</label>
              <select className="vc-select" value={fStatus} onChange={e=>setFStatus(e.target.value)}>
                {options.statuses.map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div className="vc-filter">
              <label>From</label>
              <input type="date" className="vc-date" value={fFrom} onChange={e=>setFFrom(e.target.value)} />
            </div>
            <div className="vc-filter">
              <label>To</label>
              <input type="date" className="vc-date" value={fTo} onChange={e=>setFTo(e.target.value)} />
            </div>
            <div className="vc-filter" style={{justifyContent:"flex-end"}}>
              <label>&nbsp;</label>
              <button className="vc-btn secondary" onClick={()=>{setFWarehouse("All");setFChannel("All");setFOrderType("All");setFStatus("All");setFFrom("");setFTo("");}}>Clear Filters</button>
            </div>
          </div>

          <div className="vc-stats">
            <div className="vc-stat"><div className="n">{metrics.totalOrders.toLocaleString()}</div><div className="l">Total Orders</div></div>
            <div className="vc-stat"><div className="n">{metrics.totalLines.toLocaleString()}</div><div className="l">Order Lines</div></div>
            <div className="vc-stat"><div className="n">{metrics.orderQty.toLocaleString()}</div><div className="l">Total Order Qty</div></div>
            <div className="vc-stat"><div className="n" style={{color:"#ef4444"}}>{metrics.openQty.toLocaleString()}</div><div className="l">Open Qty</div></div>
            <div className="vc-stat"><div className="n" style={{color:"#22c55e"}}>{metrics.shippedQty.toLocaleString()}</div><div className="l">Shipped Qty</div></div>
          </div>

          <div className="vc-grid">
            <div className="vc-card">
              <h3>Orders by Warehouse</h3>
              <div className="vc-list">
                {metrics.whData.map(d=>(
                  <div className="vc-list-row" key={d.label}>
                    <span className="vc-list-name" title={d.label}>{d.label}</span>
                    <span className="vc-list-val">{d.value.toLocaleString()}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="vc-card">
              <h3>Status Distribution</h3>
              <Donut data={metrics.statusData} />
            </div>
            <div className="vc-card">
              <h3>Day-wise: Orders (OrderDate)</h3>
              <DayBar data={metrics.dayData} />
            </div>
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("vc-mount")).render(<App/>);
</script>
</body>
</html>
